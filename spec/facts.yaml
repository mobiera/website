decisions_2026_09_09:
  - Origami and Sherlock cut
  - founding year 2012
  - offices: Bogotá (HQ), Peru, Bolivia, Panama, Spain, Algeria
  - all thirteen published logos may be named
  - VAS content catalogue and Kinetic cut
  - Council seat: candidate; working groups SPEC-WG and Reference Implementation WG
  - timeline dates for AI One, Foundation, docs portal, certificator
  - outsourcing continues as a top-level Services page
  - biometric KYC and agriculture discontinued
  - no team members, names, bylines or photos on the site
  - docs at docs.mobiera.io; sleepy and micro proprietary
  - numbers: 25+ operators, 800 million reachable, about 60 million per day, every continent
  - no sales email, all contact through the form; NIT 900662462-4; privacy@mobiera.com
  - AI One name; Claro Perú and Halotel Tanzania references
  - ITC Avant Garde not kept; typeface chosen in the design phase
  - certification: designated by the Verana Foundation, valid until May 2029, nothing else on the page
  - stack: same as 2060.io-website, not Hugo; existing logo reused; three design directions to choose from
