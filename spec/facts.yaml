products:                                # roster: decision 2026-09-09
  aircast:
    name: Aircast
    one_line: "MNO platform for STK push marketing, bulk SMS / MMS messaging and SIM OTA campaigns"
    jobs: [push marketing channel, general messaging platform, OTA campaign manager]
    push_properties:
      - any handset, smartphone or feature phone
      - no data connection and no subscriber balance needed (0-rated MO/MT SMS shortcode)
      - bi-directional (ciphered STK bytecode down, ciphered MO-SMS up)
      - end-to-end ciphered, 3DES-CBC or AES, keys independent from OTA keys
    messaging: [SMS, binary SMS, flash SMS (class 0), MMS over MM7]
    ota: [RAM (install / update / delete applets), RFM (read / update SIM files)]
    engine: [scheduling bitmaps, targeting, whitelists and blacklists, file-drop campaign creation, statistics and service logs]
    throughput: [per-hour TPS bitmaps per SMPP / MMSC account, per-campaign priorities, per-campaign TPS caps, stale-bandwidth reuse]
    architecture: "stateless, queue-driven components; scale by adding instances"
    applets:
      sleepy: "Sleepy Full and Sleepy Lite; SIM (0x070X) and UICC (0x090X) profiles; Java Card 2.1.1; 3GPP TS 03.19 SIM Toolkit API Release 99; proprietary"
      micro: "about 1.3 KB on card for SIMs with 1.5 to 2 KB free; DISPLAY TEXT campaigns with reply; proprietary"
      third_party: "SAT and Oberthur / Idemia Pico through the USTK push API"
    integration: [Sleepy Push API, USTK Push API, SMS / MMS messaging API, file drop, webhooks, SMPP accounts, operator GUI]
    references: [Ooredoo (Algeria), Claro (Peru)]     # deployment repos; all logos cleared, decision 2026-09-09
    source: mobiera-docs (docs/aircast/*), sleepy/documentation, micro/README
  ai_one:
    name: AI One                          # decision 2026-09-09; "AI Friends" is an internal label
    one_line: "AI agents for customer support on SMS and Hologram, verifiable by design"
    launched: 2025-01
    channels: [SMS through the operator's SMSC, DIDComm through Hologram Messaging]
    properties:
      - the agent is a Verifiable Service on Verana with Service and Organization credentials
      - phone number verification by SMS PIN binds a conversation to the MSISDN
      - LLM-agnostic (LangChain based); tools over MCP; deployable in the operator's Kubernetes
      - subscriptions and charging through the operator's billing integration
    references: [Claro (Peru), Halotel (Tanzania)]   # decision 2026-09-09
    llm_providers: "to state in copy"
    source: aifriends-multichannel-chatbot and aircast-hologram-ai-agent repos; 2060.io Hologram description
  cut: [Kinetic, Origami, Sherlock, Cosmos, Enigma, Connect, Olympia, Delphi, Fulcrum]   # decision 2026-09-09
  discontinued: [biometric KYC, agriculture chain management]                             # decision 2026-09-09

