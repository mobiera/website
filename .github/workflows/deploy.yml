name: Deploy to Kubernetes (OVH)

# Rolls a Docker Hub image tag of mobiera/website out to the OVH cluster with
# the chart in charts/. Manual: pick any tag (v1.0.0, v1.0, main, latest, dev).
# Every release also deploys itself through this workflow from
# release-please.yml.
#
# Required GitHub secrets:
#   KUBECONFIG_MOBIERA_PROD        kubeconfig of the OVH production cluster
#   MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_ENCRYPTION
#   MAIL_FROM_ADDRESS MAIL_FROM_NAME
#   CONTACT_TO, and any CONTACT_TO_<TOPIC> override in use
#   ALERT_WEBHOOK_URL              optional
# Optional GitHub variables:
#   WEBSITE_NAMESPACE              default web
#   WEBSITE_HOST                   default www.mobiera.com
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (v1.0.0, v1.0, main, latest, dev)"
        required: true
        default: latest
  workflow_call:
    inputs:
      version:
        description: "Image tag to deploy"
        required: true
        type: string
    secrets:
      KUBECONFIG_MOBIERA_PROD:
        required: true
      MAIL_HOST:
        required: false
      MAIL_PORT:
        required: false
      MAIL_USERNAME:
        required: false
      MAIL_PASSWORD:
        required: false
      MAIL_ENCRYPTION:
        required: false
      MAIL_FROM_ADDRESS:
        required: false
      MAIL_FROM_NAME:
        required: false
      CONTACT_TO:
        required: false
      CONTACT_TO_AIRCAST:
        required: false
      CONTACT_TO_AI_AGENTS:
        required: false
      CONTACT_TO_TRUST:
        required: false
      CONTACT_TO_CERTIFICATION:
        required: false
      CONTACT_TO_PARTNERSHIP:
        required: false
      CONTACT_TO_CAREERS:
        required: false
      CONTACT_TO_PRESS:
        required: false
      CONTACT_TO_GENERAL:
        required: false
      ALERT_WEBHOOK_URL:
        required: false

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ vars.WEBSITE_NAMESPACE || 'web' }}
      HOST: ${{ vars.WEBSITE_HOST || 'www.mobiera.com' }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Write kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_MOBIERA_PROD }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::The KUBECONFIG_MOBIERA_PROD secret is empty. Set it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Wait for the image on Docker Hub
        run: |
          IMAGE="mobiera/website:${VERSION}"
          for i in $(seq 1 10); do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then echo "Image $IMAGE is available."; exit 0; fi
            echo "[$i/10] $IMAGE not yet on Docker Hub, waiting 30s..."; sleep 30
          done
          echo "::error::Image $IMAGE was not available after 5 minutes."; exit 1

      - name: Create or refresh the app secret
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION: ${{ secrets.MAIL_ENCRYPTION }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_TO_AIRCAST: ${{ secrets.CONTACT_TO_AIRCAST }}
          CONTACT_TO_AI_AGENTS: ${{ secrets.CONTACT_TO_AI_AGENTS }}
          CONTACT_TO_TRUST: ${{ secrets.CONTACT_TO_TRUST }}
          CONTACT_TO_CERTIFICATION: ${{ secrets.CONTACT_TO_CERTIFICATION }}
          CONTACT_TO_PARTNERSHIP: ${{ secrets.CONTACT_TO_PARTNERSHIP }}
          CONTACT_TO_CAREERS: ${{ secrets.CONTACT_TO_CAREERS }}
          CONTACT_TO_PRESS: ${{ secrets.CONTACT_TO_PRESS }}
          CONTACT_TO_GENERAL: ${{ secrets.CONTACT_TO_GENERAL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: sh ci/create-app-secret.sh

      - name: Helm upgrade
        run: |
          echo "Deploying mobiera/website:${VERSION} to namespace '${NAMESPACE}' as https://${HOST}"
          helm upgrade --install website ./charts \
            --namespace "${NAMESPACE}" --create-namespace \
            --set image.tag="${VERSION}" \
            --set ingress.host="${HOST}" \
            --wait --timeout 5m

      - name: Show deployed resources
        if: always()
        run: |
          helm status website -n "${NAMESPACE}" || true
          kubectl -n "${NAMESPACE}" get deploy,svc,ingress,certificate -l app.kubernetes.io/name=website -o wide || true
